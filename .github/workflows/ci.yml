name: CI
on: { pull_request: { } }
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  setup-build:
    uses: infrabits/ci-setup-tox-env/.github/workflows/setup.yml@0cd25fb25787c04f19ffcbd98591c542baf4b8bc # v1.11.0

  execute-lint:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@d82ddc1a7ec28bdfac53050f25a742800fe11584 # v1.7.0
    with:
      environments: ${{ needs.setup-build.outputs.lint }}

  execute-test:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@d82ddc1a7ec28bdfac53050f25a742800fe11584 # v1.7.0
    with:
      environments: ${{ needs.setup-build.outputs.test }}

  build-container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [toolforge-stable, toolforge-latest, upstream]
    needs: [setup-build, execute-lint, execute-test]
    permissions:
      security-events: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build container
        uses: infrabits/ci-pack@23a29fee6d6f6d7ea571b87c786a6ad7fcd6e618 # v2.9.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image: ghcr.io/${{ github.repository }}:${{ matrix.target }}-${{ github.sha }}
          use_builder: ${{ matrix.target }}
          run_safety_checks: ${{ matrix.target == 'toolforge-stable' && 'true' || 'false' }}

  test-container:
    runs-on: ubuntu-latest
    needs: [build-container]
    strategy:
      fail-fast: false
      matrix:
        target: [toolforge-stable, toolforge-latest, upstream]
    permissions:
      packages: read
    services:
      tools-db:
        image: mariadb:13.0
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: ci__grafana
          MARIADB_USER: ci
          MARIADB_PASSWORD: ci
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start container
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ matrix.target }}-${{ github.sha }}
          docker run -d --name grafana -p 3000:3000 \
            --network ${{ job.services.tools-db.network }} \
            -e TOOL_DATA_DIR=/tmp \
            -e TOOL_TOOLSDB_USER=ci \
            -e TOOL_TOOLSDB_PASSWORD=ci \
            --entrypoint /cnb/process/grafana \
            ghcr.io/${{ github.repository }}:${{ matrix.target }}-${{ github.sha }}

      - name: Verify grafana is ready
        run: |
          timeout 120 bash -c 'until curl --silent --fail http://127.0.0.1:3000/api/health; do sleep 1; done'

      - name: Container logs
        if: always()
        run: docker logs grafana
